{% extends "base.html" %}

{% block title %}
    Delete Comment - ProblemPool
{% endblock %}


{% block content %}

<section class="pp-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="pp-card p-4 text-center">

                    <div class="empty-state-icon mx-auto">

                        <i class="bi bi-trash"></i>

                    </div>


                    <h1 class="h4 fw-bold">
                        Delete this comment?
                    </h1>


                    <p class="text-muted">
                        This action cannot be undone.
                    </p>


                    <div class="comment-delete-preview">

                        "{{ comment.content }}"

                    </div>


                    <form method="post">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                Delete Comment
                            </button>


                            {% if comment.solution_id %}

                                <a
                                    href="{% url 'solutions:detail' comment.solution_id %}"
                                    class="btn pp-btn-outline"
                                >
                                    Cancel
                                </a>

                            {% else %}

                                <a
                                    href="{% url 'problems:detail' comment.problem_id %}"
                                    class="btn pp-btn-outline"
                                >
                                    Cancel
                                </a>

                            {% endif %}

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
